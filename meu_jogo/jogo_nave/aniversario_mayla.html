<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário, Mayla!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fce4ec;
            color: #d81b60;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            background-color: #fff;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            animation: fadeIn 2s ease-in-out;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #c2185b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        .message {
            margin-top: 20px;
            font-style: italic;
        }
        .signature {
            margin-top: 30px;
            font-weight: bold;
            font-size: 1.1em;
            color: #880e4f;
        }
        .heart {
            color: #e91e63;
        }

        /* Animação para a entrada do conteúdo */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Efeito de confete */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: transparent;
            border-radius: 50%;
            pointer-events: none;
            animation: fall 5s linear infinite;
        }
        .confetti.red { background-color: #e57373; }
        .confetti.yellow { background-color: #ffeb3b; }
        .confetti.blue { background-color: #4fc3f7; }
        .confetti.green { background-color: #81c784; }

        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Feliz Aniversário, Mayla!</h1>
        <p class="message">
            Mayla, que seu dia seja tão incrível e especial quanto você!
            Que a vida te surpreenda com muita alegria, saúde e realizações.
            Você merece toda a felicidade do mundo!
        </p>
        <p>
            <img src="https://www.sky.at/static/img/filmhighlights/Madagascar_PAM_BTR_MAIN_691108.jpg?impolicy=bp04_teaserdata_image_16_9" alt="Balões de coração" width="800">
        </p>
        <p class="signature">
            Com carinho, <br>
            [Seu Nome]
        </p>
        <audio controls autoplay style="margin-top: 20px;">
    <source src="https://youtu.be/2wS0mzT99lI?si=aiF_p-MMgteqBYw5" type="audio/mpeg">
    Seu navegador não suporta a tag de áudio.
</audio>
    </div>

    <script>
        // Função para criar confetes dinamicamente
        function createConfetti() {
            const colors = ['red', 'yellow', 'blue', 'green'];
            const confettiCount = 50;

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti', colors[Math.floor(Math.random() * colors.length)]);
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = -Math.random() * 5 + 's';
                document.body.appendChild(confetti);
            }
        }
        createConfetti();
    </script>

</body>
</html>
